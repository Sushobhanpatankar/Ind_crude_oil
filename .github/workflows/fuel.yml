name: Update Fuel Dashboard

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST = 01:30 UTC
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate fuel dashboard
        run: python generate_fuel.py

      - name: Commit and push updated docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fuel.html docs/fuel_data.json
          git diff --cached --quiet || git commit -m "chore: update fuel dashboard [skip ci]"
          git push
